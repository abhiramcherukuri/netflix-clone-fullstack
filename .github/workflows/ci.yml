name: CI Pipeline

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Format, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Install Dependencies (Clean Install)
        run: npm ci

      - name: 🎨 Code Formatting Check (Prettier)
        run: npm run format:check

      - name: 🧹 Lint Check (ESLint 10 Flat Config)
        run: npm run lint

      - name: 🔍 TypeScript Strict Type Check (All 3 Workspaces)
        run: npm run typecheck

      - name: 🔒 Security Audit (Vulnerabilities Scan)
        run: npm audit --audit-level=high

      - name: 🏗️ Angular Client Production Build
        run: npm run build:client
